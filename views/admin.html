<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Naija Bite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body"> <!-- Added admin-body class here to enable proper display of dashboard -->
    <main class="admin-container">
        <header>
            <h2>Menu Management Dashboard</h2>
        </header>
        
        <section id="category-management-section">
            <h3>Category Management</h3>
            <form id="category-form" class="admin-form-group">
                <input type="text" id="category-name" placeholder="New Category Name" required>
                <button type="submit">Create Category</button>
            </form>
            <div id="category-list" class="category-tag-list"></div>
        </section>

        <hr class="section-divider">

        <section id="menu-form-section">
            <h3>Manage Food Items</h3>
            <form id="menu-form" class="admin-form-group">
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-description" placeholder="Description (e.g. Smoky tomato rice)" required>
                <input type="number" id="item-price" placeholder="Price (₦)" min="1" required>
                <select id="item-category" required></select>
                <button type="submit" id="submit-item-btn">Add Item</button>
            </form>
        </section>
        
        <section id="menu-display-wrapper">
            <table id="menu-table" class="hidden-element">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="menu-list"></tbody>
            </table>
            <div id="menu-empty-msg">No items available in the menu.</div>
        </section>
        
        <hr class="section-divider">
        
        <section id="orders-dashboard-section">
            <h3>Live Active Orders</h3>
            <table id="orders-table" class="hidden-element">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Items</th>
                        <th>Total Paid</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-list"></tbody>
            </table>
            <div id="orders-empty-msg">No orders registered yet.</div>
        </section>
    </main>
    <script type="module" src="/js/admin.js"></script>
</body>
</html>
