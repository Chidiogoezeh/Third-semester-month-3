<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Naija Bite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="admin-container">
        <h2>Menu Management Dashboard</h2>
        <section id="menu-form-section">
            <form id="menu-form">
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-description" placeholder="Description (e.g. Smoky tomato rice)" required>
                <input type="number" id="item-price" placeholder="Price (₦)" min="1" required>
                <select id="item-category">
                    <option value="Rice Dishes">Rice Dishes</option>
                    <option value="Swallow & Soups">Swallow & Soups</option>
                    <option value="Beans and Tubers">Beans and Tubers</option>
                    <option value="Snacks and Protein">Snacks and Protein</option>
                    <option value="Drinks">Drinks</option>
                </select>
                <button type="submit">Add Item</button>
            </form>
        </section>
        <section id="menu-list">
            <!-- Rendered securely using standard DOM manipulation inside admin.js -->
        </section>
        <hr class="section-divider">
        <section id="orders-dashboard-section">
            <h3>Live Active Orders</h3>
            <div id="orders-list">
                <!-- Live tracking rows dynamically generated -->
            </div>
        </section>
    </main>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
